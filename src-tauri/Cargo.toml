[package]
name = "md-reader"
version = "0.1.0"
description = "Markdown reader with an extension platform"
edition = "2021"

[lib]
name = "md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
rayon = "1.10"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2"
tauri-plugin-cli = "2"
tauri-plugin-single-instance = "2"
